name: Release Flutter plugin

# Publishes vezmo_checkout to pub.dev when a tag like `flutter-v1.2.3` is pushed. The tag's version must match
# packages/flutter/pubspec.yaml. No stored secret: pub.dev trusts this repository's GitHub Actions (OIDC).
#
# One-time setup on pub.dev (by a Vezmo admin):
#   1. Verify the publisher `vezmo.com` (pub.dev → Create publisher, a DNS TXT record on vezmo.com).
#   2. Once the native SDKs it pins are out (Android on Maven Central, the iOS root tag), publish 0.1.0 by hand from
#      packages/flutter with `flutter pub publish` (pub.dev only allows automated publishing for a package that
#      already exists; `dart pub` can't resolve the Flutter SDK), then move the package to the vezmo.com publisher
#      (package Admin tab). Push no `flutter-v0.1.0` tag: this workflow would fail on the existing version.
#   3. Package Admin tab → Automated publishing → Enable publishing from GitHub Actions: repository
#      `vezmoPay/vezmo-mobile-sdk`, tag pattern `flutter-v{{version}}`, and "Require GitHub Actions
#      environment" `pub.dev`.
#   4. In this repository: Settings → Environments → New environment `pub.dev` (optionally with required reviewers).
on:
  push:
    tags: ['flutter-v*']

permissions:
  contents: read
  id-token: write # pub.dev's OIDC login

concurrency:
  group: release-flutter
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/flutter

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Tag matches the plugin version
        run: |
          VERSION="${GITHUB_REF_NAME#flutter-v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          [ "$VERSION" = "$PUBSPEC" ] || { echo "::error::Tag $VERSION does not match version $PUBSPEC in packages/flutter/pubspec.yaml"; exit 1; }
      # The plugin runs on the native SDKs it pins: both must be out before it is (Android on Maven Central, iOS as a
      # tag at the repository root).
      - name: The pinned native SDKs are released
        run: |
          ANDROID=$(sed -n 's/.*"com\.vezmo:vezmo-checkout:\([^"]*\)".*/\1/p' android/build.gradle.kts)
          IOS=$(sed -n 's/.*\.package(url: repository, from: "\([^"]*\)").*/\1/p' ios/vezmo_checkout/Package.swift)
          echo "Android SDK $ANDROID, iOS SDK $IOS"
          [ -n "$ANDROID" ] && [ -n "$IOS" ] || { echo "::error::Could not read the native SDK versions from android/build.gradle.kts and ios/vezmo_checkout/Package.swift"; exit 1; }
          curl -fsI "https://repo1.maven.org/maven2/com/vezmo/vezmo-checkout/$ANDROID/vezmo-checkout-$ANDROID.pom" > /dev/null \
            || { echo "::error::com.vezmo:vezmo-checkout:$ANDROID is not on Maven Central yet. Release android-v$ANDROID (and release it in the Central Portal) first."; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$IOS" > /dev/null \
            || { echo "::error::The iOS SDK tag $IOS does not exist. Push the root tag $IOS first."; exit 1; }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get && (cd example && flutter pub get)
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
      # Only now, right before publishing: the pub.dev token from GitHub's OIDC identity; Flutter's pub picks it up.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: flutter pub publish --force
