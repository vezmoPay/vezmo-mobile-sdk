name: vezmo_checkout
description: >-
  The Vezmo payment sheet for Flutter apps: cards with 3D Secure, Google Pay, Apple Pay, pay-later methods, UPI and
  Pix, in the buyer's own currency. Payments and subscriptions.
version: 0.2.0
homepage: https://vezmo.com
repository: https://github.com/vezmoPay/vezmo-mobile-sdk/tree/main/packages/flutter
issue_tracker: https://github.com/vezmoPay/vezmo-mobile-sdk/issues
documentation: https://user.vezmo.com/docs/v1/mobile
topics: [payments, checkout, subscriptions, google-pay, apple-pay]

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vezmo.flutter.checkout
        pluginClass: VezmoCheckoutPlugin
      ios:
        pluginClass: VezmoCheckoutPlugin
